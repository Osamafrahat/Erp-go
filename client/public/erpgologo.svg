<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BB8F5"/>
      <stop offset="100%" style="stop-color:#3A9DE8"/>
    </linearGradient>
    <linearGradient id="swirlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7DD3FC"/>
      <stop offset="100%" style="stop-color:#38BDF8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Blue rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- White "E" shape -->
  <g transform="translate(30, 35)">
    <path d="M85,15 L45,15 L45,30 L70,30 L70,50 L50,50 L50,65 L70,65 L70,85 L45,85 L45,100 L85,100 L85,115 L35,115 L35,15 Z" 
          fill="white" filter="url(#shadow)"/>
  </g>
  
  <!-- Blue swirl/comma shape -->
  <g transform="translate(100, 40)">
    <path d="M15,75 C15,35 45,10 75,10 C105,10 125,35 125,60 C125,85 105,100 80,100 C55,100 45,85 45,70 C45,55 55,45 70,45 C85,45 95,55 95,65 C95,75 85,80 75,80 C65,80 58,72 58,65" 
          fill="url(#swirlGrad)" stroke="none" filter="url(#shadow)"/>
  </g>
  
  <!-- "Erpgo" text -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="white" filter="url(#shadow)">Erpgo</text>
</svg>