services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: store-server
    restart: unless-stopped
    env_file: .env.docker
    ports:
      # Bound to loopback so the API is never reachable directly from the
      # internet -- host nginx owns :80 and proxies /api/ to 127.0.0.1:3001,
      # which keeps TLS termination and rate limiting in one place.
      - "127.0.0.1:3001:3001"
    volumes:
      - backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://localhost:3001/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: store-client
    restart: unless-stopped
    ports:
      # Loopback only: host nginx (see setup.js / DEPLOY.md) proxies :80 ->
      # 127.0.0.1:8080 and terminates TLS. Publishing "80:80" here collided
      # with nginx's own listen 80, so the VPS install could never work.
      # For plain `docker compose up` without host nginx, open :8080.
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  backups:
